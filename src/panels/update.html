<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="panel.css">
<style>
  /* Sparkle style: icon on the left; title, bar and a footer row (details | buttons) on the right. */
  :root { --accent: #0a84ff; --win: #ececec; --btn-native: #ffffff; --btn-border: rgba(0,0,0,.14);
    --track: rgba(0,0,0,.1); --card: #ffffff; --line: rgba(0,0,0,.1); --muted: #6e6e73; --text: #1d1d1f; }
  html.dark { --win: #2a2a2c; --btn-native: #5c5c60; --btn-border: rgba(255,255,255,.08);
    --track: rgba(255,255,255,.12); --card: #1f1f21; --line: rgba(255,255,255,.08); --muted: #98989d; --text: #f5f5f7; }
  html, body { background: var(--win); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  body { padding: 22px 24px 20px 22px; }
  .wrap { display: flex; gap: 20px; align-items: flex-start; }
  #icon { width: 64px; height: 64px; flex-shrink: 0; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; padding-top: 2px; }
  #title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  #message { font-size: 12.5px; color: var(--muted); line-height: 1.45; white-space: pre-line; }
  #message:empty { display: none; }
  #notes {
    max-height: 160px; overflow-y: auto; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  #notes:empty { display: none; }
  .bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 2px; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: var(--accent); transition: width .2s linear; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(350%); } }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  #detail:not(:empty) { margin-left: 84px; }   /* aligned with the text column (icon 64 + gap 20) */
  #detail { flex: 1; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #buttons { display: flex; gap: 10px; margin-left: auto; }
  #left-buttons { display: flex; gap: 10px; }
  #left-buttons:empty { display: none; }
  #buttons button, #left-buttons button { white-space: nowrap; }
  /* Only the release notes scroll; thin scrollbar that follows the theme. */
  #notes::-webkit-scrollbar { width: 8px; }
  #notes::-webkit-scrollbar-track { background: transparent; }
  #notes::-webkit-scrollbar-thumb { background: var(--track); border-radius: 99px; }
  #notes::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  #buttons button, #left-buttons button {
    font-family: inherit; font-weight: 400; font-size: 13px; min-width: 76px;
    padding: 4px 14px; border-radius: 6px; background: var(--btn-native); color: var(--text);
    border: 1px solid var(--btn-border); box-shadow: 0 .5px 1px rgba(0,0,0,.15);
  }
  #buttons button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="panel">
  <div class="wrap">
    <img id="icon" alt="">
    <div class="main">
      <div id="title"></div>
      <div id="message"></div>
      <div id="notes" class="scroll"></div>
      <div id="bar" class="bar hidden"><div></div></div>
    </div>
  </div>
  <!-- Full width: "Skip this version" sits at the left edge, under the icon (as in Sparkle). -->
  <div class="foot">
    <div id="left-buttons"></div>
    <div id="detail"></div>
    <div id="buttons"></div>
  </div>
  </div>
<script src="update.js"></script>
</body>
</html>
