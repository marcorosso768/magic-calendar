<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="panel.css">
<style>
  body { padding: 26px 26px 22px; }
  .box { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  #icon { width: 76px; height: 76px; margin-bottom: 4px; }
  #title { font-size: 17px; font-weight: 900; line-height: 1.25; }
  #message { font-size: 13.5px; color: var(--muted); line-height: 1.45; white-space: pre-line; }
  #notes {
    width: 100%; max-height: 210px; overflow-y: auto; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  #notes:empty { display: none; }
  .bar { width: 100%; height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--primary), var(--primary-2)); transition: width .2s; }
  .bar.indeterminate > div { width: 35%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
  #percent { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #buttons { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  #buttons button { width: 100%; }
  .hidden { display: none !important; }
</style>
</head>
<body class="drag">
  <div class="box">
    <img id="icon" alt="">
    <div id="title"></div>
    <div id="message"></div>
    <div id="notes" class="scroll"></div>
    <div id="bar" class="bar hidden"><div></div></div>
    <div id="percent" class="hidden"></div>
    <div id="buttons"></div>
  </div>
<script src="update.js"></script>
</body>
</html>
