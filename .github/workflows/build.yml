name: Build & Release

# Every push to main builds the app (to catch build errors). A tag vX.Y.Z also publishes a release.
# Release: update build-resources/release-notes.md and commit, then
#   npm version patch|minor|major   (sets package.json/package-lock.json, commits, tags vX.Y.Z)
#   git push --follow-tags          (pushes main and the tag; the tag starts the release)
#
# Release assets (the architecture is always in the name):
#   macOS   Magic-Calendar-X.Y.Z-mac-arm64.dmg / -mac-x64.dmg   (dmgbuild: HFS+ with background and layout)
#           Magic-Calendar-X.Y.Z-mac-arm64.zip / -mac-x64.zip + latest-mac.yml   (used by in-app updates)
#   Windows Magic-Calendar-X.Y.Z-win-x64.exe + latest.yml (+ .blockmap)          (used by in-app updates)
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    # macOS 26 with Xcode 26: needed to compile the Icon Composer icon (light/dark) with actool.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 26 (actool for the app icon)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun actool --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # App bundles (dist/mac, dist/mac-arm64), zips and latest-mac.yml. Nothing is uploaded here:
      # the release is created by the publish job once both platforms are built.
      - name: Build Mac app + zips + update metadata
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Electron 44 needs macOS 13 (Ventura) or later. electron-updater skips an update whose
      # minimumSystemVersion is above the running system, comparing it with os.release(), which on macOS
      # is the Darwin version: macOS 13 = Darwin 22. Without this, 1.1.x on macOS 12 would install an
      # update that cannot start. (The app itself also declares LSMinimumSystemVersion 13.0.)
      - name: Minimum macOS for in-app updates
        run: |
          echo "minimumSystemVersion: 22.0.0" >> dist/latest-mac.yml
          cat dist/latest-mac.yml

      - name: Install dmgbuild
        run: pip3 install dmgbuild --break-system-packages

      - name: Create DMGs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          dmgbuild -s build-resources/dmgbuild-settings.py -D "app=dist/mac/Magic Calendar.app" \
            "Magic Calendar" "dist/Magic-Calendar-${VERSION}-mac-x64.dmg"
          dmgbuild -s build-resources/dmgbuild-settings.py -D "app=dist/mac-arm64/Magic Calendar.app" \
            "Magic Calendar" "dist/Magic-Calendar-${VERSION}-mac-arm64.dmg"

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          retention-days: 14

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer + update metadata
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14

  # Only for tags, and only if both platforms built: one release with all the files, so the app never
  # sees a release that has the update files of just one platform.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Magic Calendar ${GITHUB_REF_NAME}" \
            --notes-file build-resources/release-notes.md \
            --latest
